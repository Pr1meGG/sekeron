# Scoring weights used by the Stage 3 recommendation engine (src/recommend.py).
#
# Principle: CAPABILITY RELEVANCE DOMINATES. Demonstrated > claimed > unknown.
# Secondary bonuses (location, preferred capability) are intentionally small so
# they can break close ties but cannot overturn a meaningful capability gap.
#
# Unknown does NOT equal false: UNKNOWN candidates remain eligible but receive
# a small penalty rather than positive match points.

weights:
  required_demonstrated: 3.0
  required_claimed: 1.0
  required_unknown_penalty: -0.5
  preferred_demonstrated: 0.75
  preferred_claimed: 0.5
  location_match: 0.2

confidence_bonus:
  HIGH: 0.5
  MEDIUM: 0.25
  LOW: 0.0

limitation_penalty:
  LIMITED_BY_PROVENANCE: -1.0
  SYNTHETIC_SAMPLE: -0.5
  ID_CONFLICT: -0.3
  NAME_MISMATCH: -0.2
  UNUSUAL_DIRECTORY_LAYOUT: -0.1
